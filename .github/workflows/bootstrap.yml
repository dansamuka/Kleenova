name: Bootstrap Kleenova site

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/bootstrap.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore production site
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, io, tarfile
          from pathlib import Path

          data = (
          ""
          ""
          )
          raw = base64.b64decode(data)
          with tarfile.open(fileobj=io.BytesIO(raw), mode="r:gz") as tf:
              for member in tf.getmembers():
                  parts = Path(member.name).parts
                  if member.name.startswith("/") or ".." in parts:
                      raise RuntimeError(f"Unsafe archive path: {member.name}")
              tf.extractall(".")
          PY
          rm -f .github/workflows/bootstrap.yml

      - name: Commit production website
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: launch Kleenova production website"
          git push origin HEAD:main
